name: tests

on:
    pull_request: ~
    push:
        branches:
            - master
            - "[0-9]+.x"
    # A new release of Symfony or PHP can break the bundle without any commit here
    schedule:
        - cron: "0 6 * * 1"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version || 'latest' }}${{ matrix.dependencies && format(', {0} dependencies', matrix.dependencies) || '' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: "8.1"
                      symfony-version: "6.4.*"
                      dependencies: lowest
                    - php-version: "8.1"
                      symfony-version: "6.4.*"
                    - php-version: "8.2"
                      symfony-version: "6.4.*"
                    - php-version: "8.2"
                      symfony-version: "7.4.*"
                    - php-version: "8.3"
                      symfony-version: "6.4.*"
                    - php-version: "8.3"
                      symfony-version: "7.4.*"
                    - php-version: "8.4"
                      symfony-version: "7.4.*"
                    - php-version: "8.4"
                    - php-version: "8.5"

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none
                  tools: flex

            - name: Get the Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache the Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ matrix.php-version }}-${{ matrix.symfony-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ matrix.php-version }}-

            - name: Install dependencies
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony-version }}
              run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

            - name: Run PHPUnit tests
              run: ./vendor/bin/phpunit

    quality:
        name: Code quality
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer update --no-interaction --no-progress

            - name: Check the coding standard
              run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Run PHPStan
              run: ./vendor/bin/phpstan analyse --no-progress
